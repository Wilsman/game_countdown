name: Bug report
description: Something is broken or shows the wrong time
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Share links contain the full timer state.
  - type: input
    id: env
    attributes:
      label: Browser, OS and your timezone
